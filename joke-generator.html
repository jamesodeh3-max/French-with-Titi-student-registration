<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 3rem 2rem;
      text-align: center;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.5rem;
      color: #667eea;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .joke-display {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 15px;
      padding: 2rem;
      margin-bottom: 2rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #667eea;
    }

    .joke-text {
      font-size: 1.3rem;
      color: #333;
      line-height: 1.6;
      font-weight: 500;
    }

    .setup {
      margin-bottom: 1rem;
      font-size: 1.2rem;
    }

    .delivery {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #764ba2;
      font-weight: 600;
    }

    .loading {
      font-size: 1.1rem;
      color: #667eea;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .error {
      color: #e74c3c;
      font-size: 1.1rem;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f5f7fa;
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .controls {
      background: #f5f7fa;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .control-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.8rem;
      display: block;
      font-size: 0.95rem;
    }

    .checkbox-group {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .checkbox-item label {
      cursor: pointer;
      color: #555;
      font-weight: 500;
    }

    .stats {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 2px solid #e0e0e0;
    }

    .stat-item {
      display: inline-block;
      margin: 0 1.5rem;
      color: #666;
      font-size: 0.95rem;
    }

    .stat-value {
      font-weight: 700;
      color: #667eea;
      font-size: 1.3rem;
    }

    .joke-type {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 1rem;
    }

    @media (max-width: 600px) {
      .container {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 2rem;
      }

      .joke-text {
        font-size: 1.1rem;
      }

      .button-group {
        flex-direction: column;
        gap: 0.8rem;
      }

      button {
        width: 100%;
      }

      .checkbox-group {
        flex-direction: column;
        gap: 1rem;
      }

      .stat-item {
        display: block;
        margin: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😂 Joke Generator</h1>
    <p class="subtitle">Get a random laugh every time!</p>

    <div class="controls">
      <label class="control-label">Joke Type Preferences:</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="general" value="general" checked>
          <label for="general">General</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="programming" value="programming" checked>
          <label for="programming">Programming</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="knock-knock" value="knock-knock" checked>
          <label for="knock-knock">Knock-Knock</label>
        </div>
      </div>
    </div>

    <div class="joke-display">
      <div class="joke-text" id="jokeDisplay">
        Click "Get Joke" to load your first joke! 🎭
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="getJokeBtn" onclick="getJoke()">
        Get Joke 🎲
      </button>
      <button class="btn-secondary" id="shareBtn" onclick="shareJoke()" disabled>
        Share 📤
      </button>
      <button class="btn-secondary" id="copyBtn" onclick="copyJoke()" disabled>
        Copy 📋
      </button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="jokeCount">0</div>
        <div>Jokes Loaded</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="jokeType">—</div>
        <div>Current Type</div>
      </div>
    </div>
  </div>

  <script>
    let jokeCount = 0;
    let currentJoke = '';
    let currentType = '';

    const API_URL = 'https://v2.jokeapi.dev/joke';

    function getSelectedCategories() {
      const categories = [];
      if (document.getElementById('general').checked) categories.push('Any');
      if (document.getElementById('programming').checked) categories.push('Programming');
      if (document.getElementById('knock-knock').checked) categories.push('Knock-knock');
      return categories.length > 0 ? categories.join(',') : 'Any';
    }

    async function getJoke() {
      const jokeDisplay = document.getElementById('jokeDisplay');
      const getJokeBtn = document.getElementById('getJokeBtn');
      const categories = getSelectedCategories();

      // Show loading state
      jokeDisplay.innerHTML = '<div class="loading">Loading a laugh... 🤔</div>';
      getJokeBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/${categories}?type=single,twopart`);
        
        if (!response.ok) {
          throw new Error('Failed to fetch joke');
        }

        const data = await response.json();

        if (data.error) {
          jokeDisplay.innerHTML = '<div class="error">No jokes found for selected categories. Try a different combination! 😅</div>';
          currentJoke = '';
        } else {
          currentType = data.category;
          jokeCount++;

          if (data.type === 'single') {
            currentJoke = data.joke;
            jokeDisplay.innerHTML = `
              <div class="joke-text">
                ${data.joke}
              </div>
              <div class="joke-type">${data.category}</div>
            `;
          } else if (data.type === 'twopart') {
            currentJoke = `${data.setup}\n\n${data.delivery}`;
            jokeDisplay.innerHTML = `
              <div class="joke-text">
                <div class="setup">${data.setup}</div>
                <div class="delivery">${data.delivery}</div>
              </div>
              <div class="joke-type">${data.category}</div>
            `;
          }

          document.getElementById('jokeCount').textContent = jokeCount;
          document.getElementById('jokeType').textContent = currentType;

          // Enable share and copy buttons
          document.getElementById('shareBtn').disabled = false;
          document.getElementById('copyBtn').disabled = false;
        }
      } catch (error) {
        jokeDisplay.innerHTML = `
          <div class="error">
            Oops! Couldn't fetch a joke. Please check your internet connection and try again. 🌐
            <br><small>${error.message}</small>
          </div>
        `;
        currentJoke = '';
        document.getElementById('shareBtn').disabled = true;
        document.getElementById('copyBtn').disabled = true;
      } finally {
        getJokeBtn.disabled = false;
      }
    }

    function copyJoke() {
      if (!currentJoke) return;

      navigator.clipboard.writeText(currentJoke).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied! ✅';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      }).catch(err => {
        alert('Failed to copy joke: ' + err);
      });
    }

    function shareJoke() {
      if (!currentJoke) return;

      const shareText = `Check out this joke: ${currentJoke}\n\nGenerated by Joke Generator 😂`;

      if (navigator.share) {
        navigator.share({
          title: 'Funny Joke',
          text: shareText
        }).catch(err => console.log('Error sharing:', err));
      } else {
        // Fallback: copy to clipboard and show message
        navigator.clipboard.writeText(shareText).then(() => {
          alert('Joke copied to clipboard! Share it with your friends. 😂');
        });
      }
    }

    // Load initial joke on page load
    window.addEventListener('DOMContentLoaded', () => {
      getJoke();
    });

    // Allow Enter key to get new joke
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        getJoke();
      }
    });
  </script>
</body>
</html>
